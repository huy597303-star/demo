services:
  - type: web
    name: socialstock-bot-v5
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "9047366482"
      - key: DB_PATH
        value: /var/data/bot_store.db
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
    disk:
      name: socialstock-data
      mountPath: /var/data
      sizeGB: 1
